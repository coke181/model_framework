[pytest]
testpaths = tests
addopts = -ra --strict-markers -m "not browser and not integration"
markers =
    smoke: service health and critical-path checks
    auth: authentication, authorization, and session checks
    admin: administration API and management UI checks
    business: end-to-end game business workflow checks
    ui: browser-facing management page checks
    browser: real browser end-to-end tests, excluded from the default fast suite
    integration: tests requiring MySQL/Redis, excluded from the default fast suite
    realtime: WebSocket and other real-time transport tests
